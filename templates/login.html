{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block public_content %}
<div class="container py-5" style="max-width: 480px; margin-top: 2rem;">
    <div class="glass-card p-4 p-md-5" style="border-color: rgba(255, 255, 255, 0.12);">
        <div class="text-center mb-4">
            <div class="logo-icon-box mx-auto mb-3" style="width: 50px; height: 50px;">
                <i data-lucide="lock" style="color: #ffffff; width: 24px; height: 24px;"></i>
            </div>
            <h2 class="h3 fw-bold">Sign In to SentimentIQ</h2>
            <p class="text-secondary" style="font-size: 0.9rem;">Access your private sentiment analytics workspace</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="mb-3">
                <label for="login_id" class="form-label text-secondary" style="font-size: 0.85rem; font-weight: 600;">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                        <i data-lucide="user" style="width: 16px; height: 16px;"></i>
                    </span>
                    <input type="text" class="form-control bg-dark text-light border-secondary border-opacity-50 py-2" id="login_id" name="login_id" value="{{ login_id or '' }}" placeholder="Enter username or email" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label text-secondary mb-0" style="font-size: 0.85rem; font-weight: 600;">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                        <i data-lucide="key" style="width: 16px; height: 16px;"></i>
                    </span>
                    <input type="password" class="form-control bg-dark text-light border-secondary border-opacity-50 py-2" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-brand w-100 justify-content-center py-2 mb-3" id="login-submit-btn">
                <span>Sign In</span>
                <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
            </button>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25" style="font-size: 0.88rem; color: #94a3b8;">
                Don't have an account yet? 
                <a href="{{ url_for('auth.register') }}" class="fw-semibold ms-1" style="color: #818cf8;">Create an Account</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
