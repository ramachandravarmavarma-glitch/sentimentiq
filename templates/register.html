{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block public_content %}
<div class="container py-5" style="max-width: 500px; margin-top: 1.5rem;">
    <div class="glass-card p-4 p-md-5" style="border-color: rgba(255, 255, 255, 0.12);">
        <div class="text-center mb-4">
            <div class="logo-icon-box mx-auto mb-3" style="width: 50px; height: 50px;">
                <i data-lucide="user-plus" style="color: #ffffff; width: 24px; height: 24px;"></i>
            </div>
            <h2 class="h3 fw-bold">Create Your Account</h2>
            <p class="text-secondary" style="font-size: 0.9rem;">Join SentimentIQ and start evaluating text intelligence</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary" style="font-size: 0.85rem; font-weight: 600;">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                        <i data-lucide="user" style="width: 16px; height: 16px;"></i>
                    </span>
                    <input type="text" class="form-control bg-dark text-light border-secondary border-opacity-50 py-2" id="username" name="username" value="{{ username or '' }}" placeholder="e.g. alex_dev" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label text-secondary" style="font-size: 0.85rem; font-weight: 600;">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                        <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
                    </span>
                    <input type="email" class="form-control bg-dark text-light border-secondary border-opacity-50 py-2" id="email" name="email" value="{{ email or '' }}" placeholder="alex@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label text-secondary" style="font-size: 0.85rem; font-weight: 600;">Password (Min. 6 chars)</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                        <i data-lucide="key" style="width: 16px; height: 16px;"></i>
                    </span>
                    <input type="password" class="form-control bg-dark text-light border-secondary border-opacity-50 py-2" id="password" name="password" placeholder="Create secure password" required minlength="6">
                </div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label text-secondary" style="font-size: 0.85rem; font-weight: 600;">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                        <i data-lucide="check" style="width: 16px; height: 16px;"></i>
                    </span>
                    <input type="password" class="form-control bg-dark text-light border-secondary border-opacity-50 py-2" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-brand w-100 justify-content-center py-2 mb-3" id="register-submit-btn">
                <span>Create Account</span>
                <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
            </button>

            <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25" style="font-size: 0.88rem; color: #94a3b8;">
                Already have an account? 
                <a href="{{ url_for('auth.login') }}" class="fw-semibold ms-1" style="color: #818cf8;">Sign In</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
